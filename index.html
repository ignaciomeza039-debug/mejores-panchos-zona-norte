<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchos Zona Norte | La guía definitiva</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts / Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        #map { height: 100%; width: 100%; min-height: 400px; border-radius: 0.75rem; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-6 py-3.5 z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 p-2 rounded-xl text-xl shadow-lg shadow-amber-500/20">🌭</div>
            <div>
                <h1 class="text-base font-extrabold tracking-wider text-white flex items-center gap-2">
                    PANCHOS <span class="text-amber-500">ZONA NORTE</span>
                </h1>
                <p class="text-xs text-zinc-400">La guía definitiva del súper pancho bsas</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="abrirRuleta()" class="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 text-xs px-4 py-2 rounded-xl font-semibold transition flex items-center gap-2">
                🎰 Ruleta Panchera
            </button>
            <button onclick="abrirModal()" class="bg-amber-500 hover:bg-amber-600 text-zinc-950 text-xs px-4 py-2 rounded-xl font-bold transition shadow-lg shadow-amber-500/20 flex items-center gap-1.5">
                + Sumar Puesto
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">
        
        <!-- Sidebar de Filtros y Listado -->
        <div class="w-full lg:w-[420px] bg-zinc-900/50 border-r border-zinc-800 flex flex-col z-10 shrink-0">
            
            <!-- Panel de Filtros -->
            <div class="p-4 border-b border-zinc-800 space-y-3 bg-zinc-900">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-1.5">
                        <span class="text-amber-500">⚡</span> Filtros
                    </span>
                    <button onclick="limpiarFiltros()" class="text-xs text-zinc-500 hover:text-zinc-300 transition">Limpiar</button>
                </div>
                
                <!-- Buscador -->
                <div class="relative">
                    <input type="text" id="buscador" placeholder="Buscar puesto, calle..." oninput="filtrarPanchos()" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition">
                </div>

                <!-- Partido / Zona -->
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 mb-1">Partido / Zona</label>
                    <select id="filtro-partido" onchange="filtrarPanchos()" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                        <option value="">Todos los partidos</option>
                        <option value="Tigre">Tigre</option>
                        <option value="San Fernando">San Fernando</option>
                        <option value="Vicente López">Vicente López</option>
                        <option value="San Isidro">San Isidro</option>
                        <option value="San Martín">San Martín</option>
                        <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                    </select>
                </div>

                <!-- Categorías / Pills -->
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 mb-1.5">Categorías / Atributos</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button type="button" onclick="toggleCategoria('24hs', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">24hs</button>
                        <button type="button" onclick="toggleCategoria('Puesto Callejero', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Puesto Callejero</button>
                        <button type="button" onclick="toggleCategoria('Local Clásico', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Local Clásico</button>
                        <button type="button" onclick="toggleCategoria('Emblemático', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Panchería Emblemática</button>
                        <button type="button" onclick="toggleCategoria('Estación', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Kiosco de Estación</button>
                    </div>
                </div>
            </div>

            <!-- Tabs de Vista (Lista / Mapa) -->
            <div class="p-3 bg-zinc-900/80 border-b border-zinc-800 flex gap-2">
                <button onclick="cambiarVista('lista')" id="btn-tab-lista" class="flex-1 bg-amber-500 text-zinc-950 text-xs font-bold py-1.5 rounded-lg transition shadow">Lista (<span id="contador-lista">0</span>)</button>
                <button onclick="cambiarVista('mapa')" id="btn-tab-mapa" class="flex-1 bg-zinc-800 text-zinc-300 text-xs font-semibold py-1.5 rounded-lg hover:bg-zinc-700 transition">Mapa Interactivo</button>
            </div>

            <!-- Contenedor del Listado Lateral -->
            <div id="lista-panchos" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
                <!-- Se llena dinámicamente con JS -->
            </div>

            <!-- Footer Stats -->
            <div class="p-3 bg-zinc-900 border-t border-zinc-800 flex justify-between items-center text-[11px] text-zinc-500">
                <span>🔥 Puestos verificados: <strong id="total-verificados" class="text-zinc-300">0</strong></span>
                <span>Actualizado 2026</span>
            </div>
        </div>

        <!-- Área Principal (Mapa o Grid de Tarjetas) -->
        <div class="flex-1 flex flex-col bg-zinc-950 p-4 overflow-hidden">
            <div id="vista-mapa-container" class="flex-1 hidden h-full">
                <div id="map"></div>
            </div>
            <div id="vista-grid-container" class="flex-1 overflow-y-auto custom-scrollbar grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tarjetas en formato grid grande -->
            </div>
        </div>
    </div>

    <!-- Modal Agregar Puesto -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl max-w-md w-full p-6 relative">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><span>🌭</span> Agregar nuevo puesto</h2>
            <form id="form-pancho" onsubmit="guardarPancho(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Nombre del lugar</label>
                    <input type="text" id="nombre" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Partido</label>
                    <select id="partido-modal" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                        <option value="Tigre">Tigre</option>
                        <option value="San Fernando">San Fernando</option>
                        <option value="Vicente López">Vicente López</option>
                        <option value="San Isidro">San Isidro</option>
                        <option value="San Martín">San Martín</option>
                        <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Categoría</label>
                    <select id="category-modal" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                        <option value="Emblemático">Emblemático</option>
                        <option value="Puesto Callejero">Puesto Callejero</option>
                        <option value="Estación">Estación</option>
                        <option value="24hs">24hs</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Dirección completa</label>
                    <input type="text" id="address" placeholder="Ej: Av. Cazón 1200, Tigre" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Precio aprox. ($)</label>
                        <input type="text" id="precio" placeholder="3600" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Rating (Estrellas)</label>
                        <input type="number" step="0.1" id="rating" value="4.8" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Toppings (separados por coma)</label>
                    <input type="text" id="toppings" placeholder="Cheddar fundido, Lluvia de papas, Salsa criolla" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Descripción / Reseña</label>
                    <textarea id="description" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-xs font-medium text-zinc-400 hover:bg-zinc-800 rounded-xl">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-xs font-bold bg-amber-500 text-zinc-950 hover:bg-amber-600 rounded-xl shadow-lg shadow-amber-500/20">Guardar puesto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ruleta Panchera -->
    <div id="modal-ruleta" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center relative">
            <div class="text-4xl mb-2">🎰</div>
            <h2 class="text-lg font-bold text-white mb-1">Ruleta Panchera</h2>
            <p class="text-xs text-zinc-400 mb-4">¿Indeciso? Dejá que el destino elija dónde comés hoy.</p>
            <div id="resultado-ruleta" class="bg-zinc-950 border border-amber-500/30 p-4 rounded-xl mb-4 text-amber-400 font-semibold text-xs">
                ¡Girá la ruleta para elegir!
            </div>
            <div class="flex space-x-2">
                <button onclick="girarRuleta()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-zinc-950 text-xs py-2.5 rounded-xl font-bold transition shadow-lg shadow-amber-500/20">¡Girar Ruleta!</button>
                <button onclick="cerrarRuleta()" class="px-4 py-2 text-xs font-medium text-zinc-400 hover:bg-zinc-800 rounded-xl">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Tus credenciales configuradas previamente en Vercel)
        const SUPABASE_URL = window.SUPABASE_URL || 'TU_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'TU_SUPABASE_ANON_KEY';
        
        let supabaseClient;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error("Error al iniciar Supabase:", e);
        }

        let map = L.map('map', { zoomControl: false }).setView([-34.4500, -58.5800], 12);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        
        // Capa de mapa con estilo oscuro (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let listaPanchosGlobal = [];
        let categoriaSeleccionada = '';
        let vistaActual = 'grid'; // 'grid' o 'mapa'

        async function cargarPanchos() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('panchos').select('*');
            if (error) {
                console.error('Error al cargar panchos:', error);
                return;
            }
            listaPanchosGlobal = data || [];
            filtrarPanchos();
        }

        function renderizarPanchos(panchos) {
            const contenedorLista = document.getElementById('lista-panchos');
            const contenedorGrid = document.getElementById('vista-grid-container');
            document.getElementById('contador-lista').innerText = panchos.length;
            document.getElementById('total-verificados').innerText = panchos.length;
            
            contenedorLista.innerHTML = '';
            contenedorGrid.innerHTML = '';
            markersLayer.clearLayers();

            if (panchos.length === 0) {
                contenedorLista.innerHTML = '<p class="p-4 text-xs text-zinc-500 text-center">No se encontraron puestos.</p>';
                contenedorGrid.innerHTML = '<div class="col-span-2 p-8 text-center text-zinc-500 text-xs">No se encontraron puestos con los filtros seleccionados.</div>';
                return;
            }

            panchos.forEach(p => {
                const toppingsArray = p.toppings ? p.toppings.split(',').map(t => t.trim()) : [];
                const tagsHtml = toppingsArray.slice(0, 3).map(t => `<span class="bg-zinc-900 border border-zinc-800 text-zinc-400 text-[10px] px-2 py-0.5 rounded-md">${t}</span>`).join('');

                // 1. Renderizar en Lista Lateral
                const itemLista = document.createElement('div');
                itemLista.className = 'bg-zinc-900/90 border border-zinc-800/80 hover:border-amber-500/50 p-3 rounded-xl cursor-pointer transition space-y-1.5';
                itemLista.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] bg-amber-500/10 text-amber-400 font-semibold px-2 py-0.5 rounded">${p.partido || 'Zona Norte'}</span>
                            <h3 class="font-bold text-white text-xs">${p.name}</h3>
                        </div>
                        <span class="text-[11px] text-amber-400 font-bold">★ ${p.rating || 4.8}</span>
                    </div>
                    <p class="text-[11px] text-zinc-400">📍 ${p.address}</p>
                    <div class="flex flex-wrap gap-1 pt-1">${tagsHtml}</div>
                `;
                itemLista.onclick = () => {
                    if (p.lat && p.lng) {
                        cambiarVista('mapa');
                        map.setView([p.lat, p.lng], 16);
                    }
                };
                contenedorLista.appendChild(itemLista);

                // 2. Renderizar en Grid Principal (Estilo Tarjeta Detallada)
                const tarjetaGrid = document.createElement('div');
                tarjetaGrid.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-amber-500/40 transition';
                tarjetaGrid.innerHTML = `
                    <div class="p-4 space-y-2">
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] bg-amber-500 text-zinc-950 font-bold px-2 py-0.5 rounded-md">${p.partido || 'Zona Norte'}</span>
                                <span class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-md">${p.category || 'Clásico'}</span>
                            </div>
                            <span class="text-xs bg-amber-500/10 border border-amber-500/30 text-amber-400 font-bold px-2 py-0.5 rounded-lg">★ ${p.rating || 4.8}</span>
                        </div>
                        <h3 class="font-bold text-white text-sm">${p.name}</h3>
                        <p class="text-xs text-zinc-400">📍 ${p.address}</p>
                        <p class="text-xs text-zinc-300 italic line-clamp-2">${p.description || 'El clásico pancho al paso imperdible de la zona.'}</p>
                        <div class="flex flex-wrap gap-1.5 pt-1">${tagsHtml}</div>
                    </div>
                    <div class="bg-zinc-950 px-4 py-3 border-t border-zinc-800/80 flex justify-between items-center">
                        <div>
                            <span class="text-[10px] text-zinc-500 block uppercase font-medium">Precio pancho</span>
                            <span class="text-sm font-extrabold text-white">$${p.precio || '3.600'}</span>
                        </div>
                        <button onclick="verEnMapa(${p.lat}, ${p.lng}, '${p.name}')" class="bg-zinc-800 hover:bg-zinc-700 text-white text-xs px-3 py-1.5 rounded-xl font-semibold transition">Ver Ficha</button>
                    </div>
                `;
                contenedorGrid.appendChild(tarjetaGrid);

                // 3. Renderizar marcador en el Mapa
                if (p.lat && p.lng) {
                    const marker = L.marker([p.lat, p.lng]).addTo(markersLayer);
                    marker.bindPopup(`<div style="color:#000; font-family:Inter,sans-serif;"><b>${p.name}</b><br>${p.address}<br><b>$${p.precio || '3.600'}</b></div>`);
                }
            });
        }

        function filtrarPanchos() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const partidoFiltro = document.getElementById('filtro-partido').value;
            
            const filtrados = listaPanchosGlobal.filter(p => {
                const matchQuery = p.name.toLowerCase().includes(query) || 
                                   p.address.toLowerCase().includes(query) || 
                                   (p.toppings && p.toppings.toLowerCase().includes(query));
                const matchPartido = !partidoFiltro || p.partido === partidoFiltro;
                const matchCategoria = !categoriaSeleccionada || p.category === categoriaSeleccionada || (p.toppings && p.toppings.includes(categoriaSeleccionada));
                return matchQuery && matchPartido && matchCategoria;
            });
            renderizarPanchos(filtrados);
        }

        function toggleCategoria(cat, btn) {
            if (categoriaSeleccionada === cat) {
                categoriaSeleccionada = '';
                btn.classList.remove('border-amber-500', 'text-amber-400', 'bg-amber-500/10');
            } else {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('border-amber-500', 'text-amber-400', 'bg-amber-500/10'));
                categoriaSeleccionada = cat;
                btn.classList.add('border-amber-500', 'text-amber-400', 'bg-amber-500/10');
            }
            filtrarPanchos();
        }

        function limpiarFiltros() {
            document.getElementById('buscador').value = '';
            document.getElementById('filtro-partido').value = '';
            categoriaSeleccionada = '';
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('border-amber-500', 'text-amber-400', 'bg-amber-500/10'));
            filtrarPanchos();
        }

        function cambiarVista(vista) {
            vistaActual = vista;
            const btnLista = document.getElementById('btn-tab-lista');
            const btnMapa = document.getElementById('btn-tab-mapa');
            const contMapa = document.getElementById('vista-mapa-container');
            const contGrid = document.getElementById('vista-grid-container');

            if (vista === 'lista') {
                btnLista.className = "flex-1 bg-amber-500 text-zinc-950 text-xs font-bold py-1.5 rounded-lg transition shadow";
                btnMapa.className = "flex-1 bg-zinc-800 text-zinc-300 text-xs font-semibold py-1.5 rounded-lg hover:bg-zinc-700 transition";
                contGrid.classList.remove('hidden');
                contMapa.classList.add('hidden');
            } else {
                btnMapa.className = "flex-1 bg-amber-500 text-zinc-950 text-xs font-bold py-1.5 rounded-lg transition shadow";
                btnLista.className = "flex-1 bg-zinc-800 text-zinc-300 text-xs font-semibold py-1.5 rounded-lg hover:bg-zinc-700 transition";
                contMapa.classList.remove('hidden');
                contGrid.classList.add('hidden');
                setTimeout(() => { map.invalidateSize(); }, 200);
            }
        }

        function verEnMapa(lat, lng, nombre) {
            cambiarVista('mapa');
            map.setView([lat, lng], 16);
        }

        async function guardarPancho(e) {
            e.preventDefault();
            if (!supabaseClient) {
                alert("Supabase no está configurado correctamente.");
                return;
            }

            const name = document.getElementById('nombre').value;
            const partido = document.getElementById('partido-modal').value;
            const category = document.getElementById('category-modal').value;
            const address = document.getElementById('address').value;
            const precio = document.getElementById('precio').value;
            const rating = parseFloat(document.getElementById('rating').value);
            const toppings = document.getElementById('toppings').value;
            const description = document.getElementById('description').value;

            // Geocodificación automática mediante Nominatim
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', ' + partido + ', Buenos Aires, Argentina')}`);
                const results = await response.json();

                let lat = -34.4500;
                let lng = -58.5800;

                if (results && results.length > 0) {
                    lat = parseFloat(results[0].lat);
                    lng = parseFloat(results[0].lon);
                }

                const { error } = await supabaseClient.from('panchos').insert([{
                    name, partido, category, address, precio, rating, toppings, description, lat, lng
                }]);

                if (error) throw error;

                cerrarModal();
                document.getElementById('form-pancho').reset();
                cargarPanchos();
            } catch (err) {
                console.error('Error al guardar:', err);
                alert('Hubo un error al guardar el puesto en Supabase.');
            }
        }

        function abrirModal() { document.getElementById('modal').classList.remove('hidden'); }
        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }
        function abrirRuleta() { document.getElementById('modal-ruleta').classList.remove('hidden'); }
        function cerrarRuleta() { document.getElementById('modal-ruleta').classList.add('hidden'); }

        function girarRuleta() {
            if (listaPanchosGlobal.length === 0) return;
            const randomP = listaPanchosGlobal[Math.floor(Math.random() * listaPanchosGlobal.length)];
            document.getElementById('resultado-ruleta').innerHTML = `🎉 ¡Hoy se come en <b class="text-white">${randomP.name}</b> (${randomP.partido})!`;
        }

        // Inicializar datos al cargar la página
        cargarPanchos();
    </script>
