<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchos Zona Norte | La guía definitiva</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts / Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        #map { height: 100%; width: 100%; min-height: 400px; border-radius: 0.75rem; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 flex items-center justify-between px-6 py-3.5 z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 p-2 rounded-xl text-xl shadow-lg shadow-amber-500/20">🌭</div>
            <div>
                <h1 class="text-base font-extrabold tracking-wider text-white flex items-center gap-2">
                    PANCHOS <span class="text-amber-500">ZONA NORTE</span>
                </h1>
                <p class="text-xs text-zinc-400">La guía definitiva del súper pancho bsas</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="abrirRuleta()" class="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 text-xs px-4 py-2 rounded-xl font-semibold transition flex items-center gap-2">
                🎰 Ruleta Panchera
            </button>
            <button onclick="abrirModal()" class="bg-amber-500 hover:bg-amber-600 text-zinc-950 text-xs px-4 py-2 rounded-xl font-bold transition shadow-lg shadow-amber-500/20 flex items-center gap-1.5">
                + Sumar Puesto
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">
        
        <!-- Sidebar de Filtros y Listado -->
        <div class="w-full lg:w-[420px] bg-zinc-900/50 border-r border-zinc-800 flex flex-col z-10 shrink-0">
            
            <!-- Panel de Filtros -->
            <div class="p-4 border-b border-zinc-800 space-y-3 bg-zinc-900">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-1.5">
                        <span class="text-amber-500">⚡</span> Filtros
                    </span>
                    <button onclick="limpiarFiltros()" class="text-xs text-zinc-500 hover:text-zinc-300 transition">Limpiar</button>
                </div>
                
                <!-- Buscador -->
                <div class="relative">
                    <input type="text" id="buscador" placeholder="Buscar puesto, calle..." oninput="filtrarPanchos()" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition">
                </div>

                <!-- Partido / Zona -->
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 mb-1">Partido / Zona</label>
                    <select id="filtro-partido" onchange="filtrarPanchos()" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500 transition">
                        <option value="">Todos los partidos</option>
                        <option value="Tigre">Tigre</option>
                        <option value="San Fernando">San Fernando</option>
                        <option value="Vicente López">Vicente López</option>
                        <option value="San Isidro">San Isidro</option>
                        <option value="San Martín">San Martín</option>
                        <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                    </select>
                </div>

                <!-- Categorías / Pills -->
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 mb-1.5">Categorías / Atributos</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button type="button" onclick="toggleCategoria('24hs', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">24hs</button>
                        <button type="button" onclick="toggleCategoria('Puesto Callejero', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Puesto Callejero</button>
                        <button type="button" onclick="toggleCategoria('Local Clásico', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Local Clásico</button>
                        <button type="button" onclick="toggleCategoria('Emblemático', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Panchería Emblemática</button>
                        <button type="button" onclick="toggleCategoria('Estación', this)" class="cat-btn text-[11px] bg-zinc-950 border border-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg hover:border-amber-500/50 transition">Kiosco de Estación</button>
                    </div>
                </div>
            </div>

            <!-- Tabs de Vista (Lista / Mapa) -->
            <div class="p-3 bg-zinc-900/80 border-b border-zinc-800 flex gap-2">
                <button onclick="cambiarVista('lista')" id="btn-tab-lista" class="flex-1 bg-amber-500 text-zinc-950 text-xs font-bold py-1.5 rounded-lg transition shadow">Lista (<span id="contador-lista">0</span>)</button>
                <button onclick="cambiarVista('mapa')" id="btn-tab-mapa" class="flex-1 bg-zinc-800 text-zinc-300 text-xs font-semibold py-1.5 rounded-lg hover:bg-zinc-700 transition">Mapa Interactivo</button>
            </div>

            <!-- Contenedor del Listado Lateral -->
            <div id="lista-panchos" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3">
                <!-- Se llena dinámicamente con JS -->
            </div>

            <!-- Footer Stats -->
            <div class="p-3 bg-zinc-900 border-t border-zinc-800 flex justify-between items-center text-[11px] text-zinc-500">
                <span>🔥 Puestos verificados: <strong id="total-verificados" class="text-zinc-300">0</strong></span>
                <span>Actualizado 2026</span>
            </div>
        </div>

        <!-- Área Principal (Mapa o Grid de Tarjetas) -->
        <div class="flex-1 flex flex-col bg-zinc-950 p-4 overflow-hidden">
            <div id="vista-mapa-container" class="flex-1 hidden h-full">
                <div id="map"></div>
            </div>
            <div id="vista-grid-container" class="flex-1 overflow-y-auto custom-scrollbar grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tarjetas en formato grid grande -->
            </div>
        </div>
    </div>

    <!-- Modal Agregar Puesto -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl max-w-md w-full p-6 relative">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><span>🌭</span> Agregar nuevo puesto</h2>
            <form id="form-pancho" onsubmit="guardarPancho(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Nombre del lugar</label>
                    <input type="text" id="nombre" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Partido</label>
                    <select id="partido-modal" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                        <option value="Tigre">Tigre</option>
                        <option value="San Fernando">San Fernando</option>
                        <option value="Vicente López">Vicente López</option>
                        <option value="San Isidro">San Isidro</option>
                        <option value="San Martín">San Martín</option>
                        <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Categoría</label>
                    <select id="category-modal" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-amber-500 focus:outline-none">
                        <option value="Emblemático">Emblemático</option>
                        <option value="Puesto Callejero">Puesto Callejero</option>
                        <option value="Estación">Estación</option>
                        <option value="24hs">24hs</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-zinc-400 uppercase mb-1">Dirección completa</label>
                    <input type="text" id="address" placeholder="Ej: Av. Cazón 1200, Tigre" required class="w-full bg-zinc-950 border border-zinc-
