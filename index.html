<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Mejores Panchos de Zona Norte</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts / Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        #map { height: 100vh; width: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen overflow-hidden">

    <!-- Header / Navbar -->
    <header class="bg-amber-600 text-white shadow-md z-20 flex items-center justify-between px-6 py-3">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🌭</span>
            <h1 class="text-lg font-bold tracking-tight">Panchos Zona Norte</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="abrirRuleta()" class="bg-amber-700 hover:bg-amber-800 text-white text-sm px-4 py-2 rounded-lg font-medium transition shadow-sm flex items-center gap-1.5">
                🎰 Ruleta Panchera
            </button>
            <button onclick="abrirModal()" class="bg-white text-amber-700 hover:bg-amber-50 text-sm px-4 py-2 rounded-lg font-semibold transition shadow-sm">
                + Agregar Puesto
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden relative">
        
        <!-- Sidebar / Lista -->
        <div class="w-full md:w-96 bg-white border-r border-gray-200 flex flex-col z-10 shadow-lg">
            <div class="p-4 border-b border-gray-100">
                <input type="text" id="buscador" placeholder="Buscar por nombre, partido o toppings..." oninput="filtrarPanchos()" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div id="lista-panchos" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-gray-100">
                <!-- Se llena con JS -->
            </div>
        </div>

        <!-- Mapa -->
        <div class="flex-1 h-full relative">
            <div id="map"></div>
        </div>
    </div>

    <!-- Modal Agregar Puesto -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Agregar nuevo puesto de panchos</h2>
            <form id="form-pancho" onsubmit="guardarPancho(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre del lugar</label>
                    <input type="text" id="nombre" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Partido</label>
                    <select id="partido" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="Tigre">Tigre</option>
                        <option value="San Fernando">San Fernando</option>
                        <option value="Vicente López">Vicente López</option>
                        <option value="San Isidro">San Isidro</option>
                        <option value="San Martín">San Martín</option>
                        <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoría</label>
                    <select id="category" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        <option value="Emblemático">Emblemático</option>
                        <option value="Carrito">Carrito</option>
                        <option value="Estación">Estación</option>
                        <option value="24hs">24hs</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Dirección completa</label>
                    <input type="text" id="address" placeholder="Ej: Av. Cazón 1200, Tigre" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Toppings / Aderezos</label>
                    <input type="text" id="toppings" placeholder="Ej: Lluvia de papas, cheddar, salsa criolla" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Descripción / Reseña</label>
                    <textarea id="description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm font-medium bg-amber-600 hover:bg-amber-700 text-white rounded-lg shadow-sm">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ruleta Panchera -->
    <div id="modal-ruleta" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 text-center relative">
            <div class="text-4xl mb-2">🎰</div>
            <h2 class="text-xl font-bold text-gray-800 mb-1">Ruleta Panchera</h2>
            <p class="text-xs text-gray-500 mb-4">¿Indeciso? Dejמש que el destino elija dónde comés hoy.</p>
            <div id="resultado-ruleta" class="bg-amber-50 border border-amber-200 p-4 rounded-xl mb-4 text-amber-900 font-semibold text-sm">
                ¡Girá la ruleta para elegir!
            </div>
            <div class="flex space-x-2">
                <button onclick="girarRuleta()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white text-sm py-2.5 rounded-lg font-semibold shadow-sm transition">¡Girar!</button>
                <button onclick="cerrarRuleta()" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Tus credenciales públicas)
        const SUPABASE_URL = 'https://tu-proyecto.supabase.co'; // Reemplaza con tu URL si es necesario o déjalo configurado en Vercel
        const SUPABASE_ANON_KEY = 'tu-anon-key';
        
        // Inicializar cliente (si usas variables de entorno o inyección de Vercel)
        const supabaseClient = window.supabase.createClient(
            window.SUPABASE_URL || SUPABASE_URL, 
            window.SUPABASE_ANON_KEY || SUPABASE_ANON_KEY
        );

        let map = L.map('map').setView([-34.4500, -58.5800], 12);
        let markersLayer = L.layerGroup().addTo(map);
        let listaPanchosGlobal = [];

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        async function cargarPanchos() {
            const { data, error } = await supabaseClient.from('panchos').select('*');
            if (error) {
                console.error('Error al cargar panchos:', error);
                return;
            }
            listaPanchosGlobal = data || [];
            renderizarPanchos(listaPanchosGlobal);
        }

        function renderizarPanchos(panchos) {
            const contenedor = document.getElementById('lista-panchos');
            contenedor.innerHTML = '';
            markersLayer.clearLayers();

            if (panchos.length === 0) {
                contenedor.innerHTML = '<p class="p-4 text-sm text-gray-500 text-center">No se encontraron puestos.</p>';
                return;
            }

            panchos.forEach(p => {
                // Renderizar en lista lateral
                const item = document.createElement('div');
                item.className = 'p-4 hover:bg-gray-50 cursor-pointer transition';
                item.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-gray-800 text-sm">${p.name}</h3>
                        <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">${p.category}</span>
                    </div>
                    <p class="text-xs text-gray-500 mb-1">📍 ${p.address} (${p.partido})</p>
                    <p class="text-xs text-gray-600 italic">🌭 ${p.toppings || 'Sin aderezos especificados'}</p>
                `;
                item.onclick = () => {
                    map.setView([p.lat, p.lng], 15);
                };
                contenedor.appendChild(item);

                // Renderizar en mapa
                if (p.lat && p.lng) {
                    const marker = L.marker([p.lat, p.lng]).addTo(markersLayer);
                    marker.bindPopup(`<b>${p.name}</b><br>${p.address}<br><i>${p.toppings || ''}</i>`);
                }
            });
        }

        function filtrarPanchos() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const filtrados = listaPanchosGlobal.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.partido.toLowerCase().includes(query) || 
                (p.toppings && p.toppings.toLowerCase().includes(query))
            );
            renderizarPanchos(filtrados);
        }

        async function guardarPancho(e) {
            e.preventDefault();
            const name = document.getElementById('nombre').value;
            const partido = document.getElementById('partido').value;
            const category = document.getElementById('category').value;
            const address = document.getElementById('address').value;
            const toppings = document.getElementById('toppings').value;
            const description = document.getElementById('description').value;

            // Geocodificar dirección con Nominatim
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ', ' + partido + ', Buenos Aires, Argentina')}`);
                const results = await response.json();

                let lat = -34.4500;
                let lng = -58.5800;

                if (results && results.length > 0) {
                    lat = parseFloat(results[0].lat);
                    lng = parseFloat(results[0].lon);
                }

                const { error } = await supabaseClient.from('panchos').insert([{
                    name, partido, category, address, toppings, description, lat, lng, rating: 5.0
                }]);

                if (error) throw error;

                cerrarModal();
                document.getElementById('form-pancho').reset();
                cargarPanchos();
            } catch (err) {
                console.error('Error al guardar:', err);
                alert('Hubo un error al guardar el puesto.');
            }
        }

        function abrirModal() { document.getElementById('modal').classList.remove('hidden'); }
        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }
        function abrirRuleta() { document.getElementById('modal-ruleta').classList.remove('hidden'); }
        function cerrarRuleta() { document.getElementById('modal-ruleta').classList.add('hidden'); }

        function girarRuleta() {
            if (listaPanchosGlobal.length === 0) return;
            const randomP = listaPanchosGlobal[Math.floor(Math.random() * listaPanchosGlobal.length)];
            document.getElementById('resultado-ruleta').innerHTML = `🎉 ¡Hoy se come en <b>${randomP.name}</b> (${randomP.partido})!`;
        }

        // Cargar datos al iniciar
        cargarPanchos();
    </script>
</body>
</html>
